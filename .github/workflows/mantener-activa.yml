# Mantiene "despierta" la app publicada.
# Si nadie la usa por un rato, Vercel apaga la función y la siguiente petición tarda más
# (arranque en frío: en producción se midieron ~300 ms solo de servidor contra ~15–35 ms normales).
# Cada 5 minutos este flujo visita las rutas principales para que el evaluador no reciba ese arranque.
# Solo lee: no cambia datos. Si producción no responde 200, la ejecución queda en rojo.
name: Mantener activa la app

on:
  schedule:
    - cron: "*/5 * * * *"
  # Botón "Run workflow" en la pestaña Actions para correrlo a mano.
  workflow_dispatch:

permissions: {}

concurrency:
  group: mantener-activa
  cancel-in-progress: true

jobs:
  ping:
    name: Visitar producción
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      PRODUCTION_URL: https://omnimarket-hub-brown.vercel.app
    steps:
      - name: Visitar endpoints y página de inicio de sesión
        run: |
          failed=0
          for path in "/api/test/analytics?page=1&limit=50" "/api/test/kanban-status" "/login"; do
            result=$(curl -s -o body.txt -w "%{http_code} %{time_total}" --max-time 30 "$PRODUCTION_URL$path") || result="000 0"
            status=${result% *}
            total=${result#* }
            server=$(grep -o '"durationMs":[0-9.]*' body.txt 2>/dev/null | cut -d: -f2)
            echo "::notice title=$path::HTTP $status · total ${total}s${server:+ · servidor ${server} ms}"
            [ "$status" = "200" ] || failed=1
          done
          if [ "$failed" = "1" ]; then
            echo "::error::Producción no respondió 200 en todas las rutas"
            exit 1
          fi
